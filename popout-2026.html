    <style>
        .popout-page .workviewleft { min-width: 0; }
        .popout-page .popout-stack {
            display: flex;
            flex-direction: column;
            gap: 0;
            margin: 0;
            padding: 0;
            width: 100%;
        }
        .popout-page .popout-panel {
            display: block;
            position: relative;
            flex: none;
            width: 100%;
            margin: 0;
            padding: 0;
            border: 0;
            line-height: 0;
            font-size: 0;
        }
        .popout-page .popout-panel > img,
        .popout-page .popout-panel > video {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            max-height: none;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }
    </style>
