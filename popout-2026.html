    <!-- Popout 的样式只作用于本页，不需要修改公共 CSS。 -->
    <style>
        .popout-page .workviewleft { min-width: 0; }
        .popout-page .popout-stack {
            display: flex;
            flex-direction: column;
            gap: 0;
            margin: 0;
            padding: 0;
            width: 100%;
        }
        .popout-page .popout-panel {
            display: block;
            position: relative;
            flex: none;
            width: 100%;
            margin: 0;
            padding: 0;
            border: 0;
            line-height: 0;
            font-size: 0;
        }
        .popout-page .popout-panel > img,
        .popout-page .popout-panel > video {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            max-height: none;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }

        /* 第 24 页：三张 Story 卡片，PNG 内容 + WebM 边缘光效。 */
        .popout-page #popout-24 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3%;
            aspect-ratio: 16 / 9;
            background: #171713;
            isolation: isolate;
        }
        .popout-page .popout-story {
            position: relative;
            flex: 0 0 22%;
            width: 22%;
            aspect-ratio: 358 / 739;
            overflow: hidden;
            border-radius: 7.82% / 3.79%;
            isolation: isolate;
            background: #171713;
        }
        .popout-page .popout-story > img,
        .popout-page .popout-story > video {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            max-width: none;
            max-height: none;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }
        .popout-page .popout-story > img { object-fit: contain; }
        .popout-page .popout-story > video {
            /* WebM 为 390×844，适配 PNG 的 358×739；只缩放光效。 */
            object-fit: fill;
            mix-blend-mode: screen;
            pointer-events: none;
        }

        /* 第 08 页：1920×1080 原图中的左侧 700×1000 动画。 */
        .popout-page #popout-08 { aspect-ratio: 1920 / 1080; }
        .popout-page .popout-color-animation {
            position: absolute;
            left: 1.97916667%; /* 38 / 1920 */
            top: 3.61111111%; /* 39 / 1080 */
            width: 36.45833333%; /* 700 / 1920 */
            height: 92.59259259%; /* 1000 / 1080 */
            overflow: hidden;
            border-radius: 3.42857143% / 2.4%;
            line-height: 0;
        }
        .popout-page .popout-color-animation > video {
            display: block;
            width: 100%;
            height: 100%;
            max-width: none;
            max-height: none;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 0;
            box-shadow: none;
            object-fit: cover;
        }

        /* 第 03 页：以 1920×1000 背景为坐标，整张卡片覆盖为动画。 */
        .popout-page #popout-03 { aspect-ratio: 1920 / 1000; }
        .popout-page #popout-03 > .popout-overview-motion {
            position: absolute;
            display: block;
            width: 31.25%; /* 600 / 1920 */
            height: auto;
            max-width: none;
            max-height: none;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 0;
            box-shadow: none;
            object-fit: fill;
            pointer-events: none;
        }
        .popout-page #popout-03 > .popout-overview-motion-1 {
            left: 2.05729167%; /* 39.5 / 1920 */
            top: 9.95%;
            height: 32.85%;
        }
        .popout-page #popout-03 > .popout-overview-motion-2 {
            left: 66.69270833%; /* 1280.5 / 1920 */
            top: 9.95%;
            height: 51.6%;
        }
        .popout-page #popout-03 > .popout-overview-motion-3 {
            left: 66.69270833%;
            top: 63.85%;
            height: 26.2%;
        }

        /* 第 13 页：763×763 动画，黑色以 screen 混合，保留原图细线。 */
        .popout-page #popout-13 {
            aspect-ratio: 1920 / 1080;
            isolation: isolate;
            background: #000;
        }
        .popout-page #popout-13 > .popout-depth-animation {
            position: absolute;
            left: 1.66666667%; /* 32 / 1920 */
            top: 29.16666667%; /* 315 / 1080 */
            width: 39.73958333%; /* 763 / 1920 */
            height: 70.64814815%; /* 763 / 1080 */
            max-width: none;
            max-height: none;
            object-fit: contain;
            mix-blend-mode: screen;
            pointer-events: none;
        }
/* 第 28 页：模糊背景 + 手机界面 + screen 渐变 + SVG 边框。 */
.popout-page .popout-28-scene { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #55524a; isolation: isolate; }
.popout-page .popout-28-background { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.popout-page .popout-28-phone { position: absolute; left: 50%; top: 50%; width: 20.833333%; aspect-ratio: 400 / 844; transform: translate(-50%, -50%); }
.popout-page .popout-28-screen { position: absolute; left: 1.25%; top: 0; width: 97.5%; height: 100%; border-radius: 5.128205% / 2.369668%; overflow: hidden; isolation: isolate; background: #000; }
.popout-page .popout-28-interface, .popout-page .popout-28-glow { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: fill; }
.popout-page .popout-28-glow { mix-blend-mode: screen; pointer-events: none; }
.popout-page .popout-28-frame { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }

.popout-page .popout-28-phone img, .popout-page .popout-28-phone video { max-width: none; max-height: none; margin: 0; padding: 0; border: 0; box-shadow: none; }


        /* 第 29 页：纯色背景 + 手机视频 + SVG 边框。 */
        .popout-page #popout-29 {
            aspect-ratio: 1920 / 1080;
            background: #171713;
            overflow: hidden;
            isolation: isolate;
        }
        .popout-page .popout-29-phone {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 20.83333333%; /* 400 / 1920 */
            aspect-ratio: 400 / 844;
            transform: translate(-50%, -50%);
        }
        .popout-page .popout-29-screen {
            position: absolute;
            left: 1.25%; /* 5 / 400 */
            top: 0;
            width: 97.5%; /* 390 / 400 */
            height: 100%;
            border-radius: 5.12820513% / 2.36966825%;
            overflow: hidden;
            background: #171713;
        }
        .popout-page .popout-29-screen > video,
        .popout-page .popout-29-phone > .popout-29-frame {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            max-width: none;
            max-height: none;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 0;
            box-shadow: none;
            object-fit: fill;
        }
        .popout-page .popout-29-frame { pointer-events: none; }
    </style>
